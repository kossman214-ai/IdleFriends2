[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200

[[redirects]]
  from = "/api/presence"
  to = "/.netlify/functions/presence"
  status = 200

[[redirects]]
  from = "/api/reset-data"
  to = "/.netlify/functions/reset-data"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
